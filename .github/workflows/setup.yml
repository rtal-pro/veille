name: Setup (migrations SQL)

# Un tap dans l'onglet Actions : applique toutes les migrations sql/*.sql dans
# l'ordre, sur la base Supabase — applique 000 → 006. Idempotent — relançable
# sans risque, y compris pour toute future migration 007+ ajoutée au repo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier le secret DB
        env:
          S_DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          [ -n "$S_DB" ] || { echo "::error::SUPABASE_DB_URL manquant — créer le secret avant de lancer Setup"; exit 1; }
      - uses: actions/checkout@v4
      - name: Appliquer les migrations (idempotentes, dans l'ordre)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          for f in $(ls sql/*.sql | sort); do
            echo "===== $f ====="
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -1 -f "$f"
          done
          echo "✅ Toutes les migrations sont appliquées."

name: Superviseur hebdo

on:
  schedule:
    - cron: "0 13 * * 6"    # samedi 13:00 UTC, fenêtre de quota fraîche
  workflow_dispatch:

# contents+PR : nécessaires pour brancher et ouvrir la Pull Request d'amélioration
permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write
  actions: read

concurrency:
  group: veille
  cancel-in-progress: false

env:
  # Le Superviseur ouvre les preuve_url des audits (pages web arbitraires) —
  # même exposition qu'un agent de veille classique. Le rôle agent_veille a
  # tout ce qu'il faut (SELECT/INSERT/UPDATE sur audits/modifications, cf. 006).
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_AGENT }}
  # PAT fine-grained (contents+workflows) recommandé : sans lui, les PR qui modifient
  # les fichiers .github/workflows/*.yml seront refusées au push (limite du GITHUB_TOKEN).
  GH_TOKEN: ${{ secrets.SUPERVISEUR_PAT || github.token }}

jobs:
  superviseur:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUPERVISEUR_PAT || github.token }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Tu es l'agent SUPERVISEUR. Lis d'abord prompts/_constitution.md (règles absolues), puis prompts/superviseur.md, et exécute intégralement ta mission hebdomadaire d'audit et d'auto-correction."
          claude_args: "--model claude-sonnet-5 --max-turns 120 --dangerously-skip-permissions"
      # 2026-09-07 — l'audit ne part plus par email (décision du lecteur : un seul
      # mail par jour, celui du mémo quotidien). Rien n'est perdu : le Superviseur
      # écrit son audit dans la table `audits` (kpis, diagnostic, recommandations)
      # et continue d'ouvrir et merger sa PR d'amélioration hebdomadaire.
      # `select * from audits order by date_audit desc limit 1;` pour le relire.
      - name: Alerte issue si le Superviseur a échoué
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🛑 Superviseur hebdo en échec" \
            --body "Le job superviseur a échoué : ni audit en base, ni PR d'amélioration cette semaine. Voir le run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

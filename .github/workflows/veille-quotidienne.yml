name: Veille quotidienne

on:
  schedule:
    # Cadence 2 passes, et pas davantage. Mesuré le 2026-08-31 sur les logs de
    # la porte : passer de 1 à 5 crons (commit 96c5de5) a fait glisser le retard
    # de déclenchement du cron mémo de +35 min à +5 h 32 (jusqu'à +12 h 19 le
    # 28/08). Le mémo tombait alors APRÈS la lecture de la Lectrice (08:00 UTC),
    # qui criait « Pipeline muet » sur un pipeline simplement en retard.
    - cron: "30 4 * * *"    # passe MÉMO — 04:30 UTC : récolte + jugement + email
    # Filet : récolte l'après-midi, ET rattrape le mémo s'il manque encore. Pas
    # besoin de logique dédiée — la porte la rétrograde en récolte seule via son
    # garde deja_fait dès que le mémo du jour existe.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: veille
  cancel-in-progress: false

env:
  # Agents run under the restricted agent_veille role; prompts read $SUPABASE_DB_URL.
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_AGENT }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  # Plafonds Firecrawl, lus par scripts/fc.sh (guichet unique). Réglables sans
  # toucher au code : Settings → Secrets and variables → Actions → Variables.
  # Le budget est GLOBAL AU JOUR et partagé par tous les agents et tous les runs
  # (compteur en base, table firecrawl_appels) — pas un budget par processus.
  FIRECRAWL_BUDGET_JOUR: ${{ vars.FIRECRAWL_BUDGET_JOUR || '10' }}
  FIRECRAWL_CAP_RUN: ${{ vars.FIRECRAWL_CAP_RUN || '6' }}
  FIRECRAWL_RESERVE: ${{ vars.FIRECRAWL_RESERVE || '40' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Vérifier les secrets
        env:
          S_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          S_DB: ${{ secrets.SUPABASE_DB_URL }}
          S_DBA: ${{ secrets.SUPABASE_DB_URL_AGENT }}
          S_GU: ${{ secrets.GMAIL_USER }}
          S_GP: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ok=1
          [ -n "$S_TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN manquant"; ok=0; }
          [ -n "$S_DB" ]    || { echo "::error::SUPABASE_DB_URL manquant"; ok=0; }
          [ -n "$S_DBA" ]   || { echo "::error::SUPABASE_DB_URL_AGENT manquant"; ok=0; }
          [ -n "$S_GU" ]    || { echo "::error::GMAIL_USER manquant"; ok=0; }
          [ -n "$S_GP" ]    || { echo "::error::GMAIL_APP_PASSWORD manquant"; ok=0; }
          [ "$ok" = "1" ]

  migrations:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer les migrations (idempotentes, transactionnelles)
        env:
          DB_OWNER: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          for f in $(ls sql/*.sql | sort); do
            echo "===== $f ====="
            psql "$DB_OWNER" -v ON_ERROR_STOP=1 -1 -f "$f"
          done

  porte:
    needs: [migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deja_fait: ${{ steps.check.outputs.deja_fait }}
      memo: ${{ steps.check.outputs.memo }}
    env:
      # Job d'infra déterministe (pas un agent) : lit avec le rôle OWNER, qui
      # bypass RLS. Évite le fail-open silencieux si la policy agent_veille
      # venait à manquer (la requête agent renverrait 0 lignes sans erreur
      # → deja_fait=0 → mémo dupliqué au run de reprise 11:00).
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verdict du jour ? Passe mémo ou récolte ?
        id: check
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          N=$(psql "$SUPABASE_DB_URL" -tAc \
            "select count(*) from verdicts where date_run = current_date and type = 'quotidien'")
          if [ "$N" -ge 1 ]; then
            echo "deja_fait=1" >> "$GITHUB_OUTPUT"
            echo "Mémo du jour déjà en base."
          else
            echo "deja_fait=0" >> "$GITHUB_OUTPUT"
          fi
          SCHED="$(jq -r '.schedule // empty' "$GITHUB_EVENT_PATH")"
          MEMO="$(bash scripts/porte_memo.sh "$SCHED")"
          echo "memo=$MEMO" >> "$GITHUB_OUTPUT"
          echo "porte: deja_fait=$N schedule='$SCHED' memo=$MEMO"

  alerte-infra:
    needs: [preflight, migrations, porte]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Alerte issue si préflight/migrations/porte a échoué
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🛑 Pipeline — préflight/migrations/porte en échec ($(date -u +%F))" \
            --body "Le préflight, les migrations ou la porte du jour ont échoué. Aucun mémo ne partira aujourd'hui. Voir le run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  kiosque:
    needs: [porte]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FC_AGENT: kiosque
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Tu es l'agent KIOSQUE. Lis d'abord prompts/_constitution.md (règles absolues), puis prompts/kiosque.md, et exécute intégralement ta mission du jour."
          claude_args: "--model claude-sonnet-5 --max-turns 150 --dangerously-skip-permissions"

  prospecteur:
    needs: [porte]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FC_AGENT: prospecteur
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Tu es l'agent PROSPECTEUR. Lis d'abord prompts/_constitution.md (règles absolues), puis prompts/prospecteur.md, et exécute intégralement ta mission du jour."
          claude_args: "--model claude-sonnet-5 --max-turns 90 --dangerously-skip-permissions"

  instructeur:
    needs: [kiosque, prospecteur, porte]
    if: ${{ !cancelled() && needs.porte.result == 'success' && needs.porte.outputs.memo == '1' && needs.porte.outputs.deja_fait != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FC_AGENT: instructeur
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Tu es l'agent INSTRUCTEUR. Lis d'abord prompts/_constitution.md (règles absolues), puis prompts/instructeur.md, et exécute intégralement ta mission du jour."
          claude_args: "--model claude-opus-5 --max-turns 145 --dangerously-skip-permissions"

  contre-avocat:
    needs: [instructeur, porte]
    if: ${{ !cancelled() && needs.porte.result == 'success' && needs.porte.outputs.memo == '1' && needs.porte.outputs.deja_fait != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FC_AGENT: contre-avocat
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Tu es l'agent CONTRE-AVOCAT. Lis d'abord prompts/_constitution.md (règles absolues), puis prompts/contre-avocat.md, et exécute intégralement ta mission du jour."
          claude_args: "--model claude-sonnet-5 --max-turns 110 --dangerously-skip-permissions"

  rattrapage:
    needs: [contre-avocat, porte]
    if: ${{ !cancelled() && needs.porte.result == 'success' && needs.porte.outputs.memo == '1' && needs.porte.outputs.deja_fait != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FC_AGENT: rattrapage
    steps:
      - uses: actions/checkout@v4
      - name: "Porte du rattrapage : y a-t-il déjà un survivant récent (fenêtre 3 jours) ?"
        id: gate
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          BESOIN=$(psql "$SUPABASE_DB_URL" -tAc "
            select case when
              exists (select 1 from prospection_clones
                      where statut_pipeline='survivant' and rapport_attaque is not null
                        and date_run >= current_date - 2)
              or exists (select 1 from veille_runs
                         where agent='contre-avocat' and date_run=current_date and dont_go >= 1)
            then 0 else 1 end")
          echo "besoin=$BESOIN" >> "$GITHUB_OUTPUT"
          if [ "$BESOIN" = "1" ]; then
            echo "Aucun survivant récent (fenêtre 3 jours) : deuxième vague."
          else
            echo "Survivant déjà acquis (fenêtre 3 jours) : pas de deuxième vague (0 tour de quota)."
            psql "$SUPABASE_DB_URL" -c "insert into veille_runs (date_run, agent, candidats_inseres, dont_go, constats_methode, notes, metriques) values (current_date, 'rattrapage', 0, 0, 'STAND-DOWN déterministe (porte du workflow) : survivant récent déjà acquis, 2e vague inutile.', 'Rien à rattraper — 0 tour de quota consommé.', '{\"budget_respecte\":true,\"stand_down\":true}'::jsonb);" \
              || echo "journal stand-down non écrit (non bloquant)"
          fi
      - uses: anthropics/claude-code-action@v1
        if: ${{ steps.gate.outputs.besoin == '1' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Tu es l'agent RATTRAPAGE. Lis d'abord prompts/_constitution.md (règles absolues), puis prompts/rattrapage.md, et exécute intégralement ta mission (la porte du workflow a déjà vérifié qu'aucun survivant récent n'existe, sur une fenêtre de 3 jours)."
          claude_args: "--model claude-sonnet-5 --max-turns 110 --dangerously-skip-permissions"

  atelier:
    needs: [preflight, porte, kiosque, prospecteur, instructeur, contre-avocat, rattrapage]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.porte.result == 'success' && needs.porte.outputs.memo == '1' && needs.porte.outputs.deja_fait != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FC_AGENT: atelier
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Tu es l'agent ATELIER. Lis d'abord prompts/_constitution.md (règles absolues), puis prompts/atelier.md, et exécute intégralement ta mission du jour. Statuts des jobs amont — kiosque: ${{ needs.kiosque.result }}, prospecteur: ${{ needs.prospecteur.result }}, instructeur: ${{ needs.instructeur.result }}, contre-avocat: ${{ needs['contre-avocat'].result }}, rattrapage: ${{ needs.rattrapage.result }}. Si un job amont a échoué, dis-le en tête du mémo."
          claude_args: "--model claude-sonnet-5 --max-turns 90 --dangerously-skip-permissions"
      - name: Préparer le mémo
        id: memo
        if: ${{ always() }}
        run: |
          if [ ! -s /tmp/memo.md ]; then
            echo "⚠️ Mémo introuvable : l'agent Atelier n'a pas produit /tmp/memo.md. Voir les logs du run GitHub Actions." > /tmp/memo.md
          fi
          D="MEMO_$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          { echo "MEMO<<$D"; cat /tmp/memo.md; echo; echo "$D"; } >> "$GITHUB_OUTPUT"
      - name: Envoyer le mémo par email
        if: ${{ always() }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Veille SaaS
          to: ${{ secrets.GMAIL_USER }}
          subject: "🧭 Veille SaaS — mémo du jour"
          convert_markdown: true
          html_body: ${{ steps.memo.outputs.MEMO }}
      - name: Alerte issue si le mémo n'est pas parti
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🛑 Mémo non livré — $(date -u +%F)" \
            --body "Le job atelier a échoué (agent ou envoi email). Le mémo du jour n'est pas arrivé par email. Voir le run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

name: Fossoyeur hebdo

on:
  schedule:
    - cron: "0 6 * * 0"    # dimanche 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: veille
  cancel-in-progress: false

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_AGENT }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  FIRECRAWL_BUDGET_JOUR: ${{ vars.FIRECRAWL_BUDGET_JOUR || '10' }}
  FIRECRAWL_CAP_RUN: ${{ vars.FIRECRAWL_CAP_RUN || '6' }}
  FIRECRAWL_RESERVE: ${{ vars.FIRECRAWL_RESERVE || '40' }}
  FC_AGENT: fossoyeur

jobs:
  fossoyeur:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Tu es l'agent FOSSOYEUR-RESSUSCTEUR. Lis d'abord prompts/_constitution.md (règles absolues), puis prompts/fossoyeur.md, et exécute intégralement ta mission hebdomadaire."
          claude_args: "--model claude-sonnet-5 --max-turns 120 --dangerously-skip-permissions"
      # 2026-09-07 — le digest ne part plus par email (décision du lecteur : un seul
      # mail par jour, celui du mémo quotidien). Rien n'est perdu : le Fossoyeur
      # écrit son digest dans `verdicts` (type='hebdo') et continue de ressusciter
      # les dossiers, de scorer les sources et de réviser la doctrine.
      # `select memo_md from verdicts where type='hebdo' order by date_run desc limit 1;`
      - name: Alerte issue si le Fossoyeur a échoué
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🛑 Fossoyeur hebdo en échec" \
            --body "Le job fossoyeur a échoué : ni digest en base, ni résurrection, ni révision de doctrine cette semaine. Voir le run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
